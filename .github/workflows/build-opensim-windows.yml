name: Build OpenSim Viewer (Windows)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag, or commit to build'
        required: true
        default: 'dev'
        type: string

env:
  AUTOBUILD_VARIABLES_FILE: ${{ github.workspace }}/build-variables/variables
  XZ_DEFAULTS: -T0
  FS_RELEASE_TYPE: Manual
  FS_RELEASE_CHAN: Manual
  addrsize: 64
  EXTRA_ARGS: -DUSE_FMODSTUDIO=ON -DUSE_KDU=ON --crashreporting

jobs:
  build:
    name: Windows OpenSim ${{ matrix.variant }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        variant: [regular, avx]

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - name: Setup Python 3.11
        id: py311
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set Python environment for CMake
        shell: bash
        run: |
          echo "PYTHON=${{ steps.py311.outputs.python-path }}" >> "$GITHUB_ENV"

      - name: Install Python requirements
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify Python LLSD
        shell: bash
        run: |
          python -V
          python - <<'PY'
          import llsd
          print("Python LLSD import OK")
          PY

      - name: Setup rclone
        uses: beqjanus/setup-rclone@main
        with:
          rclone_config: ${{ secrets.RCLONE_CONFIG }}

      - name: Checkout build variables
        uses: actions/checkout@v4
        with:
          repository: FirestormViewer/fs-build-variables
          path: build-variables
          fetch-depth: 1

      - name: Set OpenSim build flags
        shell: bash
        run: |
          echo 'FS_GRID=-DOPENSIM:BOOL=ON -DHAVOK_TPV:BOOL=OFF' >> "$GITHUB_ENV"
          echo 'AUTOBUILD_VSVER=170' >> "$GITHUB_ENV"

      - name: Define Windows platform
        shell: bash
        run: |
          echo 'platform=windows64' >> "$GITHUB_ENV"
          echo 'fallback_platform=windows' >> "$GITHUB_ENV"

      - name: Download private Windows packages
        shell: bash
        run: |
          rclone copy fs_bundles: \
            --filter "- Alpha/*" \
            --filter "+ *windows*64*bz2" \
            .
          rclone copy fs_bundles: \
            --filter "- Alpha/*" \
            --filter "+ *windows*bz2" \
            .

      - name: Install private packages
        shell: bash
        run: |
          find_most_recent_bundle() {
            local pattern="$1-.*$2[-_]+.*"
            ls -t | grep -E "$pattern" | head -1 || true
          }

          for package in fmodstudio llphysicsextensions_tpv kdu; do
            package_file="$(find_most_recent_bundle "$package" "windows64")"
            if [ -z "$package_file" ]; then
              package_file="$(find_most_recent_bundle "$package" "windows")"
            fi

            if [ -z "$package_file" ]; then
              echo "::warning::No Windows package found for ${package}"
              continue
            fi

            echo "Installing ${package_file}"
            autobuild installables remove "${package}" || true
            autobuild installables add "${package}" \
              platform=windows64 \
              url="file:///${GITHUB_WORKSPACE}/${package_file}"
          done

      - name: Add AVX2 flags
        if: matrix.variant == 'avx'
        shell: bash
        run: |
          echo 'FS_RELEASE_CHAN=Manualx64' >> "$GITHUB_ENV"
          echo 'EXTRA_ARGS=${{ env.EXTRA_ARGS }} --avx2' >> "$GITHUB_ENV"

      - name: Show build configuration
        shell: bash
        run: |
          echo "Ref: ${{ inputs.ref }}"
          echo "Variant: ${{ matrix.variant }}"
          echo "FS_GRID: ${{ env.FS_GRID }}"
          echo "FS_RELEASE_CHAN: ${{ env.FS_RELEASE_CHAN }}"
          echo "EXTRA_ARGS: ${{ env.EXTRA_ARGS }}"
          echo "AUTOBUILD_VSVER: ${{ env.AUTOBUILD_VSVER }}"

      - name: Configure
        shell: bash
        run: |
          autobuild configure \
            -c ReleaseFS \
            -A${addrsize} \
            -- \
            --package \
            --chan "${FS_RELEASE_CHAN}" \
            ${EXTRA_ARGS} \
            ${FS_GRID}

      - name: Build
        shell: bash
        run: |
          autobuild build \
            -c ReleaseFS \
            -A${addrsize} \
            --no-configure

      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opensim-windows-${{ matrix.variant }}
          if-no-files-found: warn
          path: |
            build-*/newview/Release/*Setup.exe
            build-*/newview/Release/*.xz
            build-*/newview/Release/*.pdb
